# Gera o "MeshDeck.exe" num Windows do GitHub e anexa o .zip no Release.
#
# Como usar: no GitHub, vá em Releases → "Draft a new release", crie uma tag nova
# (ex.: v1.4) e publique. Em alguns minutos o .zip aparece sozinho no Release.
# Também dá para rodar na mão em Actions → "Gerar .exe" → "Run workflow".

name: Gerar .exe

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar as bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Montar o programa
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name "MeshDeck"
          --icon icone.ico
          --add-data "icone.ico;."
          MeshDeck.py

      - name: Compactar
        shell: pwsh
        run: |
          $versao = if ("${{ github.event.release.tag_name }}") { "${{ github.event.release.tag_name }}" } else { "teste" }
          Copy-Item LICENSE, README.md "dist/MeshDeck/"
          Compress-Archive -Path "dist/MeshDeck" -DestinationPath "MeshDeck-$versao-windows.zip"
          echo "ZIP=MeshDeck-$versao-windows.zip" >> $env:GITHUB_ENV

      - name: Anexar no Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}

      - name: Guardar o .zip (quando rodado na mão)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: MeshDeck-windows
          path: ${{ env.ZIP }}
